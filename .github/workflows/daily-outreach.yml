name: Daily Business Outreach

on:
  schedule:
    - cron: "0 8 * * 1-5"  # 8 AM UTC, weekdays only
  workflow_dispatch: {}

jobs:
  send-outreach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/send_outreach.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          LEADS_SHEET_ID: ${{ secrets.LEADS_SHEET_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
          DAILY_CAP_PROVIDER: ${{ secrets.DAILY_CAP_PROVIDER }}
          DAILY_CAP_BUYER: ${{ secrets.DAILY_CAP_BUYER }}
